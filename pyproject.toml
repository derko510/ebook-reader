[project]
name = "lamplight"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "kokoro>=0.9.4",
    "soundfile",
    "pymupdf",
    "fastapi",
    "uvicorn",
    "torch==2.6.0",
    "torchaudio==2.6.0",
    "chatterbox-tts==0.1.7",
    "numpy",
    "segno>=1.6.6",
    "python-multipart>=0.0.32",
]

[tool.uv.sources]
torch = { index = "pytorch-cu126" }
torchaudio = { index = "pytorch-cu126" }

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true
